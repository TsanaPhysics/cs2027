<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad Controller - RBRU SciWeek 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Kanit', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #video-container { flex: 1; position: relative; width: 100%; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); pointer-events: none; }
        
        #ui-layer { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        
        .status-box { font-size: 24px; font-weight: 600; padding: 10px 20px; border-radius: 12px; background: rgba(184, 105, 255, 0.2); border: 2px solid #B869FF; text-align: center; width: 100%; max-width: 400px; box-shadow: 0 0 15px rgba(184, 105, 255, 0.4); }
        .controls { display: flex; gap: 15px; width: 100%; justify-content: center; margin-top: 10px; }
        
        button { padding: 15px 30px; font-size: 20px; font-family: 'Kanit'; font-weight: bold; border: none; border-radius: 30px; cursor: pointer; transition: all 0.3s; }
        .btn-start { background: linear-gradient(45deg, #22c55e, #16a34a); color: white; box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
        .btn-reset { background: linear-gradient(45deg, #ef4444, #dc2626); color: white; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
        .btn-start:active, .btn-reset:active { transform: scale(0.95); }
        
        #progress-bar { width: 100%; max-width: 400px; height: 10px; background: rgba(255,255,255,0.2); border-radius: 5px; overflow: hidden; margin-top: 10px; display: none; }
        #progress-fill { height: 100%; width: 0%; background: #B869FF; transition: width 0.1s linear; }

        .triggered-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(34, 197, 94, 0.4); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 10; }
        .triggered-overlay h1 { font-size: 48px; text-shadow: 0 0 20px rgba(0,0,0,0.8); margin: 0; }
    </style>
</head>
<body>

<div id="video-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <div class="triggered-overlay" id="success-overlay">
        <h1>✅ ส่งคำสั่งสำเร็จ!</h1>
        <p>กำลังเล่นวิดีโอบนจอใหญ่...</p>
    </div>
</div>

<div id="ui-layer">
    <div class="status-box" id="status-text">สถานะ: รอเปิดกล้อง</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    
    <div class="controls">
        <button class="btn-start" onclick="startCamera()">📷 เปิดกล้อง</button>
        <button class="btn-reset" onclick="resetSystem()">🔄 รีเซ็ตระบบ</button>
    </div>
</div>

<script type="module">
    import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12";

    let handLandmarker;
    let isRunning = false;
    let lastVideoTime = -1;
    let isTriggered = false;
    let holdTime = 0;
    const holdDuration = 1.0; // ต้องค้างท่าไว้ 1 วินาที
    let lastTime = performance.now();
    let distHistory = [];

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status-text');
    const progressFill = document.getElementById('progress-fill');
    const progressBar = document.getElementById('progress-bar');
    const successOverlay = document.getElementById('success-overlay');

    function resizeCanvas() {
        canvas.width = video.videoWidth || window.innerWidth;
        canvas.height = video.videoHeight || window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    video.addEventListener('loadeddata', resizeCanvas);

    async function initMediaPipe() {
        statusText.textContent = "กำลังโหลดระบบ AI...";
        try {
            const resolver = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/wasm");
            handLandmarker = await HandLandmarker.createFromOptions(resolver, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 1,
                minHandDetectionConfidence: 0.65,
                minHandPresenceConfidence: 0.65,
                minTrackingConfidence: 0.65
            });
            statusText.textContent = 'พร้อมแล้ว! กดปุ่ม "เปิดกล้อง"';
        } catch (e) {
            statusText.textContent = 'ERROR: ' + e.message;
        }
    }

    async function startCamera() {
        if (!handLandmarker) return alert('AI ยังโหลดไม่เสร็จ กรุณารอสักครู่');
        
        // ขอแบบ Fullscreen บน iPad (ถ้ารองรับ)
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
        }

        try {
            // ใช้กล้องหน้า
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' } 
            });
            video.srcObject = stream;
            await video.play();
            isRunning = true;
            isTriggered = false;
            successOverlay.style.display = 'none';
            progressBar.style.display = 'block';
            statusText.textContent = 'กำลังสแกน... กรุณาทำท่า "จีบ 3 นิ้ว ชู 2 นิ้ว"';
            statusText.style.background = 'rgba(56, 189, 248, 0.2)';
            statusText.style.borderColor = '#38bdf8';
            
            requestAnimationFrame(detectLoop);
        } catch (e) {
            alert('เปิดกล้องไม่ได้: ' + e.message);
        }
    }

    function detectGestures(landmarks) {
        const wrist = landmarks[0];
        const thumbTip = landmarks[4];
        const indexMcp = landmarks[5], indexPip = landmarks[6], indexTip = landmarks[8];
        const middleMcp = landmarks[9], middlePip = landmarks[10], middleTip = landmarks[12];
        const ringMcp = landmarks[13], ringPip = landmarks[14], ringTip = landmarks[16];
        const pinkyMcp = landmarks[17], pinkyPip = landmarks[18], pinkyTip = landmarks[20];

        // 1. ระยะห่าง 3 นิ้วจีบ
        const dThumbIndex = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
        const dThumbMiddle = Math.hypot(thumbTip.x - middleTip.x, thumbTip.y - middleTip.y);
        const dIndexMiddle = Math.hypot(indexTip.x - middleTip.x, indexTip.y - middleTip.y);
        
        const avgPinchDist = (dThumbIndex + dThumbMiddle + dIndexMiddle) / 3;
        distHistory.push(avgPinchDist);
        if (distHistory.length > 5) distHistory.shift();
        const dist = distHistory.reduce((a, b) => a + b, 0) / distHistory.length;

        const thPinch = 0.055; // ค่ามาตรฐานความแม่นยำ

        const threePinchClose = (dThumbIndex < thPinch * 1.3) && (dThumbMiddle < thPinch * 1.3) && (dIndexMiddle < thPinch * 1.3);

        const dWristIndexTip = Math.hypot(indexTip.x - wrist.x, indexTip.y - wrist.y);
        const dWristMiddleTip = Math.hypot(middleTip.x - wrist.x, middleTip.y - wrist.y);
        const dWristRingTip = Math.hypot(ringTip.x - wrist.x, ringTip.y - wrist.y);
        const dWristPinkyTip = Math.hypot(pinkyTip.x - wrist.x, pinkyTip.y - wrist.y);

        // 2. 2 นิ้วชู
        const ringUp = (ringTip.y < ringPip.y - 0.015 && ringPip.y < ringMcp.y) || (dWristRingTip > dWristMiddleTip * 1.1);
        const pinkyUp = (pinkyTip.y < pinkyPip.y - 0.01 && pinkyPip.y < pinkyMcp.y) || (dWristPinkyTip > dWristIndexTip * 1.05);

        const twoFingersUp = ringUp && pinkyUp;
        return threePinchClose && twoFingersUp;
    }

    async function sendTriggerCommand() {
        if (isTriggered) return;
        isTriggered = true;
        
        statusText.textContent = '✅ ตรวจพบท่าทาง ส่งคำสั่งแล้ว!';
        statusText.style.background = 'rgba(34, 197, 94, 0.2)';
        statusText.style.borderColor = '#22c55e';
        progressFill.style.width = '100%';
        successOverlay.style.display = 'flex';

        try {
            await fetch('api.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'trigger' })
            });
        } catch (e) {
            console.error('Error sending trigger:', e);
            alert('ไม่สามารถส่งคำสั่งไปยังจอใหญ่ได้ ตรวจสอบการเชื่อมต่อ Network');
            isTriggered = false;
        }
    }

    async function resetSystem() {
        isTriggered = false;
        holdTime = 0;
        progressFill.style.width = '0%';
        successOverlay.style.display = 'none';
        
        statusText.textContent = 'กำลังสแกน... กรุณาทำท่า "จีบ 3 นิ้ว ชู 2 นิ้ว"';
        statusText.style.background = 'rgba(56, 189, 248, 0.2)';
        statusText.style.borderColor = '#38bdf8';

        try {
            await fetch('api.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'reset' })
            });
        } catch (e) {
            console.error('Error resetting:', e);
        }
    }

    async function detectLoop() {
        if (!isRunning) return;
        
        const now = performance.now();
        const dt = (now - lastTime) / 1000;
        lastTime = now;

        if (video.currentTime !== lastVideoTime) {
            lastVideoTime = video.currentTime;
            const results = handLandmarker.detectForVideo(video, now);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (results.landmarks && results.landmarks.length > 0 && !isTriggered) {
                const landmarks = results.landmarks[0];
                
                // Draw skeleton
                const connections = [[0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [5, 6], [6, 7], [7, 8], [0, 9], [9, 10], [10, 11], [11, 12], [0, 13], [13, 14], [14, 15], [15, 16], [0, 17], [17, 18], [18, 19], [19, 20]];
                ctx.strokeStyle = '#B869FF';
                ctx.lineWidth = 3;
                connections.forEach(([a, b]) => {
                    ctx.beginPath();
                    ctx.moveTo(landmarks[a].x * canvas.width, landmarks[a].y * canvas.height);
                    ctx.lineTo(landmarks[b].x * canvas.width, landmarks[b].y * canvas.height);
                    ctx.stroke();
                });

                const isValidGesture = detectGestures(landmarks);

                if (isValidGesture) {
                    holdTime += dt;
                    ctx.strokeStyle = '#22c55e'; // Green if valid
                    ctx.stroke();
                } else {
                    holdTime = Math.max(0, holdTime - dt * 2);
                }

                // Update Progress bar
                const progress = Math.min(1, Math.max(0, holdTime / holdDuration));
                progressFill.style.width = `${progress * 100}%`;

                if (progress >= 1.0) {
                    sendTriggerCommand();
                }
            } else if (!isTriggered) {
                holdTime = Math.max(0, holdTime - dt * 1.5);
                progressFill.style.width = `${Math.min(1, holdTime / holdDuration) * 100}%`;
            }
        }
        
        requestAnimationFrame(detectLoop);
    }

    // Expose functions to HTML buttons
    window.startCamera = startCamera;
    window.resetSystem = resetSystem;

    // Start loading AI on boot
    initMediaPipe();
</script>

</body>
</html>
