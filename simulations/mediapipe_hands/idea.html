<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTIMATE INTELLIGENCE NEXUS – งานสัปดาห์วิทยาศาสตร์ 2569</title>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap');

        body {
            font-family: 'Orbitron', 'Sarabun', sans-serif;
            background: #05080f;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            user-select: none;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, #0a0a1a, #05080f);
            overflow: hidden;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.2;
            filter: blur(3px) brightness(0.4);
        }
        #mediapipe-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        #three-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* ===== HUD ===== */
        #hud {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 10;
            background: rgba(0, 10, 30, 0.75);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 200, 255, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            min-width: 180px;
            font-family: 'Orbitron', monospace;
            box-shadow: 0 0 40px rgba(0, 100, 255, 0.05);
            font-size: 0.55rem;
        }
        #hud .title { color: #00ccff; font-weight: 700; border-bottom: 1px solid rgba(0,200,255,0.1); padding-bottom: 4px; margin-bottom: 4px; letter-spacing: 2px; }
        #hud .line { color: rgba(150, 200, 255, 0.5); display: flex; justify-content: space-between; padding: 2px 0; }
        #hud .line .val { color: #00ffcc; font-weight: 600; }

        /* ===== MODE SELECTOR ===== */
        #mode-selector {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 10;
            display: flex;
            gap: 8px;
            background: rgba(0, 10, 30, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 6px 12px;
            border: 1px solid rgba(0, 200, 255, 0.08);
        }
        .mode-btn {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.3);
            font-family: 'Orbitron', monospace;
            font-size: 0.5rem;
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }
        .mode-btn.active {
            color: #00ffcc;
            background: rgba(0, 255, 200, 0.1);
            border: 1px solid rgba(0, 255, 200, 0.2);
        }
        .mode-btn:hover { color: #fff; }

        /* ===== IoT DASHBOARD ===== */
        #iot-dashboard {
            position: absolute;
            right: 16px;
            bottom: 100px;
            z-index: 10;
            background: rgba(0, 10, 30, 0.75);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 200, 255, 0.08);
            border-radius: 12px;
            padding: 12px 14px;
            min-width: 150px;
            font-size: 0.5rem;
            transition: all 0.5s ease;
        }
        #iot-dashboard .header { color: rgba(150, 200, 255, 0.3); letter-spacing: 2px; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 4px; margin-bottom: 6px; text-align: center; }
        .dev-item { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 4px; transition: all 0.3s ease; }
        .dev-item .icon { font-size: 0.8rem; width: 20px; text-align: center; }
        .dev-item .name { color: rgba(200,220,240,0.4); flex: 1; }
        .dev-item .led { width: 8px; height: 8px; border-radius: 50%; background: #1a2a3a; transition: all 0.3s ease; }
        .dev-item .led.on { background: #00ff88; box-shadow: 0 0 16px #00ff88; }
        .dev-item.active { background: rgba(0, 255, 200, 0.03); border-left: 2px solid rgba(0,255,200,0.1); }

        /* ===== STATUS BAR ===== */
        #status-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 10, 30, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 200, 255, 0.08);
            border-radius: 40px;
            padding: 8px 24px;
            font-family: 'Orbitron', monospace;
            font-size: 0.55rem;
            color: rgba(0, 255, 200, 0.7);
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .dot.green { background: #00ff88; box-shadow: 0 0 16px #00ff88; }
        .dot.yellow { background: #ffcc00; box-shadow: 0 0 16px #ffcc00; }
        .dot.purple { background: #aa66ff; box-shadow: 0 0 16px #aa66ff; animation: pulseDot 0.8s infinite alternate; }
        .dot.cyan { background: #00ccff; box-shadow: 0 0 16px #00ccff; animation: pulseDot 0.5s infinite alternate; }
        @keyframes pulseDot { 0% { transform: scale(1); } 100% { transform: scale(1.3); } }

        /* ===== TITLE OVERLAY ===== */
        #title-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            pointer-events: none;
            background: rgba(0,0,0,0.1);
        }
        #title-overlay.show { display: flex; animation: fadeTitle 1.8s cubic-bezier(0.2,0.9,0.3,1.2) forwards; }
        @keyframes fadeTitle { 0% { opacity:0; transform: scale(0.7) rotateY(10deg); } 100% { opacity:1; transform: scale(1) rotateY(0); } }
        #title-overlay .main { font-size: 4.2rem; font-weight: 900; background: linear-gradient(135deg, #00ddff, #aa88ff, #ffd700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 8px; text-align: center; padding: 0 20px; }
        #title-overlay .sub { font-size: 2rem; color: #ffd700; text-shadow: 0 0 40px rgba(255,215,0,0.3); margin-top: 8px; letter-spacing: 6px; }
        #title-overlay .theme { font-size: 1rem; color: rgba(255,255,255,0.3); margin-top: 12px; letter-spacing: 4px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 12px; }

        /* ===== VOICE INDICATOR ===== */
        #voice-indicator {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            display: none;
            background: rgba(0, 200, 255, 0.08);
            border: 1px solid rgba(0, 200, 255, 0.15);
            border-radius: 30px;
            padding: 4px 18px;
            font-size: 0.5rem;
            color: #00ddff;
            backdrop-filter: blur(8px);
            letter-spacing: 2px;
        }
        #voice-indicator.active { display: flex; align-items: center; gap: 8px; animation: pulseVoice 0.8s infinite alternate; }
        @keyframes pulseVoice { 0% { opacity:0.6; } 100% { opacity:1; } }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            #title-overlay .main { font-size: 2.4rem; }
            #title-overlay .sub { font-size: 1.2rem; }
            #hud { font-size: 0.4rem; padding: 8px 12px; min-width: 120px; top: 10px; left: 10px; }
            #iot-dashboard { right: 8px; bottom: 80px; min-width: 100px; padding: 8px 10px; font-size: 0.4rem; }
            #status-bar { font-size: 0.4rem; padding: 4px 12px; gap: 8px; bottom: 12px; }
            #mode-selector { top: 10px; right: 10px; padding: 4px 8px; }
            .mode-btn { font-size: 0.4rem; padding: 2px 8px; }
        }
        @media (max-width: 500px) {
            #iot-dashboard { display: none; }
            #hud { display: none; }
            #title-overlay .main { font-size: 1.6rem; }
            #title-overlay .sub { font-size: 0.9rem; }
            #status-bar { font-size: 0.35rem; padding: 4px 8px; gap: 4px; flex-wrap: wrap; }
        }
    </style>
</head>
<body>
<div id="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="mediapipe-canvas"></canvas>
    <canvas id="three-canvas"></canvas>

    <!-- HUD -->
    <div id="hud">
        <div class="title">⟡ NEXUS</div>
        <div class="line"><span>MODE</span><span class="val" id="modeDisplay">SOLO</span></div>
        <div class="line"><span>STAGE</span><span class="val" id="stageDisplay">⏸ IDLE</span></div>
        <div class="line"><span>HAND</span><span class="val" id="handStatus">—</span></div>
        <div class="line"><span>STATUS</span><span class="val" id="sysStatus">🟢 READY</span></div>
    </div>

    <!-- Mode Selector -->
    <div id="mode-selector">
        <button class="mode-btn active" data-mode="solo">SOLO</button>
        <button class="mode-btn" data-mode="coop">CO-OP</button>
        <button class="mode-btn" data-mode="auto">AUTO</button>
    </div>

    <!-- IoT Dashboard -->
    <div id="iot-dashboard">
        <div class="header">⟡ IOT NETWORK</div>
        <div class="dev-item" id="dev-led1"><span class="icon">💡</span><span class="name">LED1</span><span class="led" id="led1-led"></span></div>
        <div class="dev-item" id="dev-led2"><span class="icon">💡</span><span class="name">LED2</span><span class="led" id="led2-led"></span></div>
        <div class="dev-item" id="dev-motor"><span class="icon">⚙️</span><span class="name">MOTOR</span><span class="led" id="motor-led"></span></div>
        <div class="dev-item" id="dev-fan"><span class="icon">🌀</span><span class="name">FAN</span><span class="led" id="fan-led"></span></div>
        <div class="dev-item" id="dev-pump"><span class="icon">💧</span><span class="name">PUMP</span><span class="led" id="pump-led"></span></div>
        <div class="dev-item" id="dev-speaker"><span class="icon">🔊</span><span class="name">SPEAKER</span><span class="led" id="speaker-led"></span></div>
    </div>

    <!-- Status Bar -->
    <div id="status-bar">
        <span><span class="dot green" id="statusDot"></span><span id="statusText">พร้อม</span></span>
        <span>|</span>
        <span>🎤 <span id="voiceStatus">รอ</span></span>
        <span>|</span>
        <span>👆 <span id="fingerStatus">รอมือ</span></span>
        <span>|</span>
        <span>🔌 <span id="iotCount">0/6</span></span>
        <span>|</span>
        <span id="authStatus">🔓</span>
    </div>

    <!-- Voice Indicator -->
    <div id="voice-indicator">
        <span style="color:#00ff88;">●</span>
        <span id="voiceText">กำลังฟัง...</span>
    </div>

    <!-- Title Overlay -->
    <div id="title-overlay">
        <div class="main">⚡ SCIENCE WEEK 2026</div>
        <div class="sub">INTELLIGENCE NEXUS</div>
        <div class="theme">✦ INTELLIGENCE SCIENCE FOR A SUSTAINABLE FUTURE ✦</div>
    </div>
</div>

<script>
    (function() {
        // ========================================================================
        // DOM REFS
        // ========================================================================
        const video = document.getElementById('video');
        const mpCanvas = document.getElementById('mediapipe-canvas');
        const mpCtx = mpCanvas.getContext('2d');
        const threeCanvas = document.getElementById('three-canvas');
        const titleOverlay = document.getElementById('title-overlay');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const fingerStatus = document.getElementById('fingerStatus');
        const voiceStatus = document.getElementById('voiceStatus');
        const voiceText = document.getElementById('voiceText');
        const voiceIndicator = document.getElementById('voice-indicator');
        const iotCount = document.getElementById('iotCount');
        const handStatus = document.getElementById('handStatus');
        const stageDisplay = document.getElementById('stageDisplay');
        const sysStatus = document.getElementById('sysStatus');
        const modeDisplay = document.getElementById('modeDisplay');
        const authStatus = document.getElementById('authStatus');

        const modeBtns = document.querySelectorAll('.mode-btn');

        // ========================================================================
        // STATE
        // ========================================================================
        let currentMode = 'solo'; // 'solo' | 'coop' | 'auto'
        let ceremonyStage = 'idle'; // idle | quantum | voice | auth | iot | complete
        let isCeremonyActive = false;
        let handLandmarks = null;
        let leftHand = null;
        let rightHand = null;
        let triangleDetected = false;
        let circleDetected = false;
        let isListening = false;
        let recognition = null;
        let ws = null;
        let wsConnected = false;
        let ceremonyTimer = null;

        // ========================================================================
        // AUDIO
        // ========================================================================
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playCeremonySound(type) {
            const ctx = initAudio();
            const now = ctx.currentTime;

            if (type === 'quantum') {
                // Wave sound
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 1.2);
                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.15, now + 0.6);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 1.6);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 1.8);
            } else if (type === 'unlock') {
                // Unlock impact
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(60, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.6);
                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.4, now + 0.3);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 1.0);
            } else if (type === 'complete') {
                // Complete fanfare
                [440, 554, 659, 880].forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.01, now + i * 0.1);
                    gain.gain.linearRampToValueAtTime(0.15, now + i * 0.1 + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + i * 0.1);
                    osc.stop(now + i * 0.1 + 0.5);
                });
            }
        }

        // ========================================================================
        // SPEECH-TO-TEXT
        // ========================================================================
        function initSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                voiceStatus.textContent = 'ไม่รองรับ';
                return null;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const rec = new SpeechRecognition();
            rec.lang = 'th-TH';
            rec.continuous = true;
            rec.interimResults = false;

            rec.onstart = () => {
                isListening = true;
                voiceIndicator.classList.add('active');
                voiceStatus.textContent = '🎤 ฟัง...';
            };
            rec.onend = () => {
                isListening = false;
                voiceIndicator.classList.remove('active');
                voiceStatus.textContent = '🎤 รอ';
                if (!isCeremonyActive && currentMode !== 'auto') {
                    setTimeout(() => { try { rec.start(); } catch(e) {} }, 500);
                }
            };
            rec.onresult = (event) => {
                const result = event.results[event.results.length - 1];
                if (!result.isFinal) return;
                const transcript = result[0].transcript.trim().toLowerCase();
                if (!transcript) return;
                voiceText.textContent = `🗣️ "${transcript}"`;
                voiceStatus.textContent = '🎤 ได้ยิน!';
                const triggers = ['เปิดงาน', 'เริ่ม', 'start', 'begin', 'go', 'เปิด', 'เริ่มงาน'];
                if (triggers.some(t => transcript.includes(t)) && !isCeremonyActive && currentMode !== 'auto') {
                    startCeremony('voice');
                }
            };
            rec.onerror = () => { voiceStatus.textContent = '🎤 ข้อผิดพลาด'; };
            return rec;
        }

        // ========================================================================
        // TEXT-TO-SPEECH
        // ========================================================================
        function speakText(text, callback) {
            if (!window.speechSynthesis) { if (callback) callback(); return; }
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'th-TH';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            const voices = speechSynthesis.getVoices();
            const thVoice = voices.find(v => v.lang.includes('th'));
            if (thVoice) utterance.voice = thVoice;
            utterance.onend = () => { if (callback) callback(); };
            speechSynthesis.speak(utterance);
        }

        // ========================================================================
        // WEBSOCKET (IoT)
        // ========================================================================
        function initWebSocket() {
            try {
                ws = new WebSocket('wss://echo.websocket.org');
                ws.onopen = () => { wsConnected = true; };
                ws.onclose = () => { wsConnected = false; };
                ws.onerror = () => { wsConnected = false; };
            } catch(e) { wsConnected = false; }
        }

        function sendIoTCommand(cmd) {
            if (ws && wsConnected) {
                try { ws.send(cmd); } catch(e) {}
            }
            // Also simulate locally
            if (cmd === 'ACTIVATE') activateAllIoT();
            else if (cmd === 'DEACTIVATE') deactivateAllIoT();
        }

        // ========================================================================
        // IoT SIMULATION
        // ========================================================================
        const iotDevices = ['led1', 'led2', 'motor', 'fan', 'pump', 'speaker'];
        let iotState = {};

        function updateIoT(device, state) {
            iotState[device] = state;
            const el = document.getElementById(device + '-led');
            const parent = document.getElementById('dev-' + device);
            if (state) {
                el.className = 'led on';
                parent.classList.add('active');
            } else {
                el.className = 'led';
                parent.classList.remove('active');
            }
            const count = iotDevices.filter(d => iotState[d]).length;
            iotCount.textContent = `${count}/${iotDevices.length}`;
        }

        function activateAllIoT() {
            iotDevices.forEach((d, i) => {
                setTimeout(() => updateIoT(d, true), i * 200);
            });
        }

        function deactivateAllIoT() {
            iotDevices.forEach(d => updateIoT(d, false));
        }

        // ========================================================================
        // THREE.JS – 3D SCENE (Quantum Waves + Spatial AR + Network)
        // ========================================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05080f);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
        camera.position.set(0, 0, 3);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({
            canvas: threeCanvas,
            alpha: false,
            antialias: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // ---- Stars ----
        const starCount = 500;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPos[i*3] = (Math.random() - 0.5) * 12;
            starPos[i*3+1] = (Math.random() - 0.5) * 10;
            starPos[i*3+2] = (Math.random() - 0.5) * 8 - 2;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0x4488aa, size: 0.005, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // ---- Quantum Wave Rings ----
        const waveGroup = new THREE.Group();
        scene.add(waveGroup);
        const waveRings = [];
        const ringColors = [0x00ddff, 0xaa66ff, 0xff66aa, 0x00ff88, 0xffd700, 0x4488ff];
        for (let i = 0; i < 6; i++) {
            const mat = new THREE.MeshBasicMaterial({
                color: ringColors[i % ringColors.length],
                transparent: true,
                opacity: 0,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending,
                wireframe: false
            });
            const geo = new THREE.RingGeometry(0.02, 0.04, 48);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.scale.set(0.1, 0.1, 0.1);
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.y = -0.2;
            waveGroup.add(mesh);
            waveRings.push({
                mesh: mesh,
                maxScale: 1.5 + i * 0.3,
                speed: 0.5 + i * 0.08,
                phase: i * 0.5,
                active: false,
                progress: 0
            });
        }

        // ---- Spatial AR Button (3D floating) ----
        const btnGroup = new THREE.Group();
        scene.add(btnGroup);
        // Disc
        const discMat = new THREE.MeshBasicMaterial({ color: 0x0088cc, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
        const disc = new THREE.Mesh(new THREE.CircleGeometry(0.12, 32), discMat);
        disc.rotation.x = -Math.PI / 2;
        btnGroup.add(disc);
        // Glow ring
        const glowMat2 = new THREE.MeshBasicMaterial({ color: 0x00ddff, transparent: true, opacity: 0.2, side: THREE.DoubleSide, blending: THREE.AdditiveBlending });
        const glowRing = new THREE.Mesh(new THREE.RingGeometry(0.13, 0.18, 32), glowMat2);
        glowRing.rotation.x = -Math.PI / 2;
        btnGroup.add(glowRing);
        // Icon
        const shape = new THREE.Shape();
        shape.moveTo(0, -0.035);
        shape.lineTo(0.05, 0);
        shape.lineTo(0, 0.035);
        shape.closePath();
        const iconMesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 }));
        iconMesh.position.z = 0.001;
        btnGroup.add(iconMesh);
        btnGroup.visible = false;

        // ---- IoT Network ----
        const netGroup = new THREE.Group();
        scene.add(netGroup);
        const core = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), new THREE.MeshBasicMaterial({ color: 0x00ddff, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending }));
        netGroup.add(core);
        const nodeMeshes = [];
        const nodePos = [];
        for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2 - Math.PI/2;
            const x = 0.8 * Math.cos(angle);
            const y = 0.6 * Math.sin(angle);
            nodePos.push({ x, y });
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshBasicMaterial({ color: 0x446688, transparent: true, opacity: 0.3 }));
            mesh.position.set(x, y, 0);
            netGroup.add(mesh);
            nodeMeshes.push(mesh);
            // Line
            const lineMat = new THREE.LineBasicMaterial({ color: 0x446688, transparent: true, opacity: 0.05 });
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array([0,0,0, x,y,0]);
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const line = new THREE.Line(geo, lineMat);
            netGroup.add(line);
            mesh.userData.line = line;
        }
        netGroup.visible = false;

        // ---- Energy Flow Particles ----
        const flowCount = 80;
        const flowGeo = new THREE.BufferGeometry();
        const flowPos = new Float32Array(flowCount * 3);
        const flowColors = new Float32Array(flowCount * 3);
        const flowData = [];
        for (let i = 0; i < flowCount; i++) {
            const target = Math.floor(Math.random() * 6);
            const prog = Math.random();
            flowPos[i*3] = prog * nodePos[target].x;
            flowPos[i*3+1] = prog * nodePos[target].y;
            flowPos[i*3+2] = (Math.random() - 0.5) * 0.02;
            const col = new THREE.Color().setHSL(0.55 + Math.random()*0.15, 0.9, 0.5 + Math.random()*0.4);
            flowColors[i*3] = col.r;
            flowColors[i*3+1] = col.g;
            flowColors[i*3+2] = col.b;
            flowData.push({ target, progress: prog, speed: 0.005 + Math.random() * 0.015, phase: Math.random() * Math.PI * 2 });
        }
        flowGeo.setAttribute('position', new THREE.BufferAttribute(flowPos, 3));
        flowGeo.setAttribute('color', new THREE.BufferAttribute(flowColors, 3));
        const flowMat = new THREE.PointsMaterial({ size: 0.02, vertexColors: true, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
        const flowPoints = new THREE.Points(flowGeo, flowMat);
        netGroup.add(flowPoints);

        // ========================================================================
        // CEREMONY ENGINE
        // ========================================================================
        function updateStage(stage) {
            ceremonyStage = stage;
            const labels = {
                'idle': '⏸ IDLE',
                'quantum': '🌊 QUANTUM',
                'voice': '🎤 AI VOICE',
                'auth': '🔐 AUTH',
                'iot': '🔌 IOT',
                'complete': '✅ COMPLETE'
            };
            stageDisplay.textContent = labels[stage] || stage;
        }

        function resetCeremony() {
            if (ceremonyTimer) { clearTimeout(ceremonyTimer); ceremonyTimer = null; }
            isCeremonyActive = false;
            updateStage('idle');
            sysStatus.textContent = '🟢 READY';
            statusDot.className = 'dot green';
            statusText.textContent = 'พร้อม';
            btnGroup.visible = false;
            waveGroup.visible = false;
            netGroup.visible = false;
            titleOverlay.classList.remove('show');
            deactivateAllIoT();
            waveRings.forEach(r => { r.active = false; r.mesh.material.opacity = 0; });
            nodeMeshes.forEach(m => { m.material.color.setHex(0x446688); m.material.opacity = 0.3; m.userData.line.material.color.setHex(0x446688); m.userData.line.material.opacity = 0.05; });
            flowMat.opacity = 0;
            core.material.color.setHex(0x00ddff);
            core.material.opacity = 0.2;
            authStatus.textContent = '🔓';
            if (currentMode === 'auto') {
                // Auto mode: restart after reset
                setTimeout(() => { if (!isCeremonyActive) startCeremony('auto'); }, 2000);
            }
        }

        function startCeremony(source) {
            if (isCeremonyActive) return;
            if (currentMode === 'auto') {
                // Auto mode: simulate full sequence
                isCeremonyActive = true;
                statusText.textContent = '🎬 Auto Demo...';
                statusDot.className = 'dot cyan';
                sysStatus.textContent = '🔶 AUTO';
                // Stage 1: Quantum
                setTimeout(() => {
                    updateStage('quantum');
                    playCeremonySound('quantum');
                    triggerQuantumWaves();
                }, 300);
                // Stage 2: Voice (AI)
                setTimeout(() => {
                    updateStage('voice');
                    speakText('ขอต้อนรับสู่งานสัปดาห์วิทยาศาสตร์แห่งชาติ ประจำปี 2569');
                }, 2500);
                // Stage 3: Auth (skip in auto)
                setTimeout(() => {
                    updateStage('auth');
                    authStatus.textContent = '⚡ UNLOCKED';
                }, 4500);
                // Stage 4: IoT
                setTimeout(() => {
                    updateStage('iot');
                    activateAllIoT();

                    nodeMeshes.forEach(m => { m.material.color.setHex(0x00ff88); m.material.opacity = 0.8; m.userData.line.material.color.setHex(0x00ff88); m.userData.line.material.opacity = 0.3; });

                setTimeout(() => {

                    // Extra fireworks
                    for (let i = 0; i < 3; i++) {
                        setTimeout(() => createFirework((Math.random()-0.5)*2, Math.random()*0.5+0.3, (Math.random()-0.5)*1.5), i * 400);
                    }
                }, 7000);
                // Reset after 10s
                ceremonyTimer = setTimeout(() => { resetCeremony(); }, 12000);

            }

            // Manual start (solo or coop)
            isCeremonyActive = true;
            statusText.textContent = '🚀 กำลังเปิด...';
            statusDot.className = 'dot purple';
            sysStatus.textContent = '🔶 ACTIVE';
            updateStage('quantum');
            playCeremonySound('quantum');
            triggerQuantumWaves();

            // Stage 2: Voice AI
            setTimeout(() => {
                updateStage('voice');
                const msg = source === 'voice' ? 'รับทราบคำสั่งเสียงครับ' : 'ตรวจจับท่าทางแล้วครับ';
                speakText(msg);
            }, 1200);

            // Stage 3: Auth (only in coop mode)
            if (currentMode === 'coop') {
                setTimeout(() => {
                    updateStage('auth');

                    authStatus.textContent = '🔒 LOCKED';
                    statusDot.className = 'dot yellow';
                    // Wait for both gestures
                    // Check in animation loop
                }, 2800);
                // We'll handle auth completion in the hand detection loop
            } else {
                // Solo: skip auth
                setTimeout(() => {
                    updateStage('auth');
                    authStatus.textContent = '⚡ UNLOCKED';
                    continueAfterAuth();
                }, 3200);
            }
        }

        function continueAfterAuth() {
            // Stage 4: IoT
            updateStage('iot');
            activateAllIoT();
            netGroup.visible = true;
            flowMat.opacity = 0.6;
            nodeMeshes.forEach(m => { m.material.color.setHex(0x00ff88); m.material.opacity = 0.8; m.userData.line.material.color.setHex(0x00ff88); m.userData.line.material.opacity = 0.3; });
            core.material.color.setHex(0xffd700);
            core.material.opacity = 0.5;
            sendIoTCommand('ACTIVATE');
            statusText.textContent = '🔌 กำลังเชื่อมต่อ IoT...';

            // Stage 5: Complete
            setTimeout(() => {
                updateStage('complete');
                playCeremonySound('complete');
                titleOverlay.classList.add('show');
                statusText.textContent = '🎉 เปิดงานสำเร็จ!';
                statusDot.className = 'dot green';
                sysStatus.textContent = '🟢 COMPLETE';
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => createFirework((Math.random()-0.5)*2, Math.random()*0.5+0.3, (Math.random()-0.5)*1.5), i * 400);
                }

            // Reset after 8s
            ceremonyTimer = setTimeout(() => { resetCeremony(); }, 10000);

        // ========================================================================
        // QUANTUM WAVES
        // ========================================================================
        function triggerQuantumWaves() {
            waveGroup.visible = true;
            waveRings.forEach((ring, i) => {
                ring.active = true;
                ring.progress = 0;
                ring.mesh.material.opacity = 0.6;
                ring.mesh.scale.set(0.1, 0.1, 0.1);
                setTimeout(() => {
                    ring.mesh.material.opacity = 0.6 - i * 0.05;
                }, i * 100);
            });
        }

        function updateQuantumWaves(time) {
            let allDone = true;
            waveRings.forEach((ring) => {
                if (!ring.active) return;
                ring.progress += 0.008 * ring.speed;
                if (ring.progress >= 1) {
                    ring.active = false;
                    ring.mesh.material.opacity = 0;
                    return;
                }
                allDone = false;
                const scale = 0.1 + ring.progress * ring.maxScale;
                ring.mesh.scale.set(scale, scale, scale);
                ring.mesh.material.opacity = (1 - ring.progress) * 0.6;
                ring.mesh.rotation.z = time * 0.001 + ring.phase;
            });
            return allDone;
        }

        // ========================================================================
        // FIREWORKS
        // ========================================================================
        function createFirework(x, y, z) {
            const count = 200;
            const colors = [0x00ddff, 0xaa88ff, 0xff66aa, 0xffd700, 0x00ff88];
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const cols = new Float32Array(count * 3);
            const data = [];
            for (let i = 0; i < count; i++) {
                const r = 0.1 + Math.random() * 1.8;
                const th = Math.random() * Math.PI * 2;
                const ph = Math.acos(2 * Math.random() - 1);
                pos[i*3] = x + r * Math.sin(ph) * Math.cos(th);
                pos[i*3+1] = y + r * Math.cos(ph);
                pos[i*3+2] = z + r * Math.sin(ph) * Math.sin(th);
                const c = new THREE.Color(colors[Math.floor(Math.random() * colors.length)]);
                cols[i*3] = c.r;
                cols[i*3+1] = c.g;
                cols[i*3+2] = c.b;
                data.push({ vx: (Math.random()-0.5)*2.5, vy: (Math.random()-0.5)*2.5+1.5, vz: (Math.random()-0.5)*2.5, life: 1, decay: 0.005+Math.random()*0.02 });
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
            const mat = new THREE.PointsMaterial({ size: 0.05, vertexColors: true, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false });
            const points = new THREE.Points(geo, mat);
            scene.add(points);
            let frame = 0;
            const anim = setInterval(() => {
                frame++;
                const p = points.geometry.attributes.position.array;
                let dead = true;
                for (let i = 0; i < count; i++) {
                    data[i].life -= data[i].decay;
                    if (data[i].life > 0) {
                        dead = false;
                        p[i*3] += data[i].vx * 0.035;
                        p[i*3+1] += data[i].vy * 0.035 - 0.025;
                        p[i*3+2] += data[i].vz * 0.035;
                        data[i].vy -= 0.035;
                    } else { p[i*3+1] = -10; }
                }
                points.geometry.attributes.position.needsUpdate = true;
                mat.opacity = Math.max(0, 1 - frame / 130);
                if (dead || frame > 130) {
                    clearInterval(anim);
                    scene.remove(points);
                    points.geometry.dispose();
                    mat.dispose();
                }
            }, 16);
        }

        // ========================================================================
        // GESTURE DETECTION
        // ========================================================================
        function detectTriangle(landmarks) {
            if (!landmarks) return false;
            const t = landmarks[4], i = landmarks[8], m = landmarks[12], r = landmarks[16], p = landmarks[20];
            const mcp = landmarks[9];
            const d = Math.hypot(t.x - i.x, t.y - i.y, t.z - i.z);
            return d < 0.05 && m.y < mcp.y - 0.02 && r.y < mcp.y - 0.02 && p.y < mcp.y - 0.02;
        }

        function detectCircle(landmarks) {
            if (!landmarks) return false;
            const t = landmarks[4], i = landmarks[8], m = landmarks[12], r = landmarks[16], p = landmarks[20];
            const d1 = Math.hypot(t.x - i.x, t.y - i.y);
            const d2 = Math.hypot(t.x - m.x, t.y - m.y);
            const d3 = Math.hypot(t.x - r.x, t.y - r.y);
            const d4 = Math.hypot(t.x - p.x, t.y - p.y);
            const palm = landmarks[9];
            const c1 = Math.hypot(i.x - palm.x, i.y - palm.y);
            const c2 = Math.hypot(m.x - palm.x, m.y - palm.y);
            const c3 = Math.hypot(r.x - palm.x, r.y - palm.y);
            const c4 = Math.hypot(p.x - palm.x, p.y - palm.y);
            return d1 < 0.08 && d2 < 0.08 && d3 < 0.08 && d4 < 0.08 && c1 < 0.12 && c2 < 0.12 && c3 < 0.12 && c4 < 0.12;
        }

        // ========================================================================
        // MEDIAPIPE HANDS
        // ========================================================================
        const hands = new Hands({
            locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`
        });
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

        hands.onResults((results) => {
            const w = mpCanvas.width;
            const h = mpCanvas.height;
            mpCtx.clearRect(0, 0, w, h);

            // Draw Spatial AR button (if idle and hand detected)
            if (isIdle() && results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                drawSpatialButton(w, h);
            }

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                let newTriangle = false, newCircle = false;
                results.multiHandLandmarks.forEach((lm, idx) => {
                    const label = results.multiHandedness?.[idx]?.label || '?';
                    const pts = lm.map(p => ({ x: p.x * w, y: p.y * h }));
                    // Draw hand
                    const conns = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
                    const isTri = detectTriangle(lm);
                    const isCir = detectCircle(lm);
                    let color = '#4488aa';
                    if (isTri) { color = '#00ffcc'; newTriangle = true; }
                    if (isCir) { color = '#ff66aa'; newCircle = true; }
                    mpCtx.strokeStyle = color;
                    mpCtx.lineWidth = 1.5;
                    for (let c of conns) {
                        if (c[0] < pts.length && c[1] < pts.length) {
                            mpCtx.beginPath();
                            mpCtx.moveTo(pts[c[0]].x, pts[c[0]].y);
                            mpCtx.lineTo(pts[c[1]].x, pts[c[1]].y);
                            mpCtx.stroke();
                        }
                    }
                    pts.forEach((p, i) => {
                        mpCtx.beginPath();
                        mpCtx.arc(p.x, p.y, i===4||i===8?6:3, 0, 2*Math.PI);
                        mpCtx.fillStyle = i===4||i===8 ? color : '#4488aa';
                        mpCtx.shadowColor = color + '44';
                        mpCtx.shadowBlur = 10;
                        mpCtx.fill();
                        mpCtx.shadowBlur = 0;
                    });
                    // Label
                    if (pts.length > 0) {
                        const w2 = pts[0];
                        mpCtx.fillStyle = color;
                        mpCtx.font = '8px Orbitron, monospace';
                        mpCtx.shadowColor = 'rgba(0,0,0,0.8)';
                        mpCtx.shadowBlur = 4;
                        const labelText = isTri ? '🔺' : isCir ? '🔵' : label;
                        mpCtx.fillText(labelText, w2.x - 12, w2.y - 20);
                        mpCtx.shadowBlur = 0;
                    }
                    // Store for coop
                    if (label === 'Left') leftHand = lm;
                    else if (label === 'Right') rightHand = lm;
                });

                triangleDetected = newTriangle;
                circleDetected = newCircle;
                handStatus.textContent = results.multiHandLandmarks.length + 'มือ';

                // Co-op auth check
                if (currentMode === 'coop' && ceremonyStage === 'auth' && triangleDetected && circleDetected) {
                    authStatus.textContent = '⚡ UNLOCKED!';
                    statusText.textContent = '🔓 ปลดล็อคสำเร็จ!';
                    playCeremonySound('unlock');
                    continueAfterAuth();
                }

                // Solo: check pinch on button
                if (isIdle() && currentMode === 'solo') {
                    const primary = results.multiHandLandmarks[0];
                    if (primary) {
                        const tip = primary[8], thumb = primary[4];
                        if (tip && thumb) {
                            const cx = w/2, cy = h/2 + 0.1 * h;
                            const r = Math.min(w,h) * 0.04;
                            const px = tip.x * w, py = tip.y * h;
                            const dist = Math.hypot(tip.x - thumb.x, tip.y - thumb.y);
                            const isPinch = dist < 0.04;
                            const isOver = Math.hypot(px - cx, py - cy) < r;
                            if (isOver) {
                                fingerStatus.textContent = '✋ เหนือปุ่ม';
                                if (isPinch) {
                                    fingerStatus.textContent = '👆 คลิก!';
                                    startCeremony('gesture');
                                }
                            } else {
                                fingerStatus.textContent = '🖐️ ชี้นิ้ว';
                            }
                        }
                    }
                } else if (ceremonyStage === 'auth') {
                    fingerStatus.textContent = triangleDetected ? '🔺 OK' : '⏳ รอ🔺';
                    if (circleDetected) fingerStatus.textContent += ' 🔵 OK';
                } else {
                    fingerStatus.textContent = '⏳ กำลังดำเนินการ...';
                }

                statusText.textContent = 'ตรวจจับมือ';
                statusDot.className = 'dot green';
            } else {
                handStatus.textContent = '—';
                leftHand = null;
                rightHand = null;
                if (isIdle()) fingerStatus.textContent = '⏳ รอมือ';
                statusText.textContent = 'รอตรวจจับ...';
                statusDot.className = 'dot yellow';
            }
        });

        function isIdle() {
            return !isCeremonyActive && ceremonyStage === 'idle';
        }

        function drawSpatialButton(w, h) {
            const cx = w/2;
            const cy = h/2 + 0.1 * h;
            const r = Math.min(w,h) * 0.04;

            // Glow
            const grad = mpCtx.createRadialGradient(cx, cy, 0, cx, cy, r*2.5);
            grad.addColorStop(0, 'rgba(0,200,255,0.04)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            mpCtx.beginPath();
            mpCtx.arc(cx, cy, r*2.5, 0, 2*Math.PI);
            mpCtx.fillStyle = grad;
            mpCtx.fill();

            // Pulse ring
            const pulse = 1 + 0.05 * Math.sin(Date.now()/500);
            mpCtx.beginPath();
            mpCtx.arc(cx, cy, r*pulse, 0, 2*Math.PI);
            mpCtx.strokeStyle = 'rgba(0,200,255,0.1)';
            mpCtx.lineWidth = 1.5;
            mpCtx.setLineDash([4,6]);
            mpCtx.stroke();
            mpCtx.setLineDash([]);

            // Button
            const grad2 = mpCtx.createRadialGradient(cx-6, cy-6, 5, cx, cy, r);
            grad2.addColorStop(0, '#00ddff');
            grad2.addColorStop(0.5, '#0088bb');
            grad2.addColorStop(1, '#004466');
            mpCtx.shadowColor = 'rgba(0,200,255,0.3)';
            mpCtx.shadowBlur = 20;
            mpCtx.beginPath();
            mpCtx.arc(cx, cy, r, 0, 2*Math.PI);
            mpCtx.fillStyle = grad2;
            mpCtx.fill();
            mpCtx.shadowBlur = 0;
            mpCtx.strokeStyle = 'rgba(0,255,200,0.3)';
            mpCtx.lineWidth = 1.5;
            mpCtx.stroke();

            mpCtx.fillStyle = '#fff';
            mpCtx.font = `bold ${r*0.3}px Orbitron, Sarabun`;
            mpCtx.textAlign = 'center';
            mpCtx.textBaseline = 'middle';
            mpCtx.shadowColor = 'rgba(0,0,0,0.8)';
            mpCtx.shadowBlur = 6;
            mpCtx.fillText('⚡ OPEN', cx, cy-2);
            mpCtx.shadowBlur = 0;

            mpCtx.fillStyle = 'rgba(0,255,200,0.2)';
            mpCtx.font = `${r*0.1}px Orbitron, Sarabun`;
            mpCtx.fillText('PINCH TO ACTIVATE', cx, cy + r + 16);
        }

        // ========================================================================

        // ========================================================================
        // RESIZE
        // ========================================================================
        function resizeAll() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            mpCanvas.width = w;
            mpCanvas.height = h;
            threeCanvas.width = w;
            threeCanvas.height = h;

        window.addEventListener('resize', resizeAll);

        // ========================================================================
        // ANIMATION LOOP
        // ========================================================================
        let lastTime = 0;

        function animate(time) {
            const dt = Math.min((time - lastTime) / 1000, 0.05);
            lastTime = time;

            // Stars
            stars.rotation.y += dt * 0.005;

            // Quantum waves
            if (waveGroup.visible) {
                const done = updateQuantumWaves(time);
                if (done && ceremonyStage === 'quantum') {
                    // Auto move to next stage if stuck
                }
            }

            // IoT network flow
            if (netGroup.visible && flowMat.opacity > 0) {
                const pos = flowPoints.geometry.attributes.position.array;
                for (let i = 0; i < flowCount; i++) {
                    const d = flowData[i];
                    d.progress += d.speed;
                    if (d.progress > 1) { d.progress = 0; d.target = Math.floor(Math.random() * 6); }
                    const target = nodePos[d.target];
                    pos[i*3] = d.progress * target.x + Math.sin(time * 0.001 + d.phase) * 0.02;
                    pos[i*3+1] = d.progress * target.y + Math.cos(time * 0.0013 + d.phase) * 0.02;
                    pos[i*3+2] = Math.sin(time * 0.002 + d.phase) * 0.015;
                }
                flowPoints.geometry.attributes.position.needsUpdate = true;
            }

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

        // ========================================================================
        // UI CONTROLS
        // ========================================================================
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                modeDisplay.textContent = currentMode.toUpperCase();
                resetCeremony();
                if (currentMode === 'auto') {
                    setTimeout(() => startCeremony('auto'), 500);
                }
                // Restart speech recognition
                if (recognition) {
                    try { recognition.stop(); } catch(e) {}
                    setTimeout(() => { try { recognition.start(); } catch(e) {} }, 300);
                }
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' && !isCeremonyActive && currentMode !== 'auto') {
                e.preventDefault();
                startCeremony('keyboard');
            }
            if (e.key === 'r' || e.key === 'R') {
                resetCeremony();
            }
            if (e.key === '1') { document.querySelector('[data-mode="solo"]').click(); }
            if (e.key === '2') { document.querySelector('[data-mode="coop"]').click(); }
            if (e.key === '3') { document.querySelector('[data-mode="auto"]').click(); }
        });

        // Click to init audio
        document.addEventListener('click', () => initAudio(), { once: true });

        // Load voices
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }

        setTimeout(resizeAll, 500);
        setInterval(resizeAll, 3000);
    })();
</script>
</body>
</html>
